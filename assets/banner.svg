<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 10 20;
      animation: dash 12s linear infinite;
    }
    .glow-bg {
      animation: float 6s infinite ease-in-out alternate;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -240; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic Glowing Background Elements (Behind Text) -->
  <g class="glow-bg">
    <circle cx="150" cy="60" r="90" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
    <circle cx="750" cy="180" r="100" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Tunnel Grid Lines (Background Decor) -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 50,40 Q 250,140 450,40 T 850,40" class="flow-line" />
    <path d="M 50,200 Q 250,100 450,200 T 850,200" class="flow-line" />
    <line x1="100" y1="20" x2="800" y2="20" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="100" y1="220" x2="800" y2="220" stroke="#334155" stroke-dasharray="4 4" />
  </g>

  <!-- Node Dots -->
  <circle cx="120" cy="120" r="6" fill="#38bdf8" class="pulse-circle" />
  <circle cx="780" cy="120" r="6" fill="#c084fc" class="pulse-circle" />

  <!-- Foreground Content (Title & Subtitle) -->
  <g transform="translate(450, 105)" text-anchor="middle">
    <!-- Security Shield Icon -->
    <path d="M -18 -45 L 0 -54 L 18 -45 V -30 C 18 -15 0 -5 0 -5 C 0 -5 -18 -15 -18 -30 Z" fill="none" stroke="url(#textGrad)" stroke-width="3" />
    <path d="M -6 -32 L -1 -27 L 7 -37" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Title -->
    <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Secure Hybrid Data Tunnel
    </text>

    <!-- Subtitle -->
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      🔒 Curated Zero-Trust Tunnels, Private Interconnects &amp; Self-Hosted VPN Overlays
    </text>
  </g>
</svg>
